<svg
	width="1000"
	height="300"
	viewBox="0 0 1000 300"
	xmlns="http://www.w3.org/2000/svg"
	role="img"
	aria-label="Aung Kaung Myat - Junior Full-Stack Developer"
	xmlns:c2pa="http://c2pa.org/manifest">
	<metadata>
		<c2pa:manifest
			></c2pa:manifest
		>
	</metadata>
	<defs>
		<linearGradient
			id="bg"
			x1="0"
			y1="0"
			x2="1"
			y2="1">
			<stop
				offset="0%"
				stop-color="#0b0b1f" />
			<stop
				offset="100%"
				stop-color="#1b1140" />
		</linearGradient>
		<linearGradient
			id="glass"
			x1="0"
			y1="0"
			x2="1"
			y2="1">
			<stop
				offset="0%"
				stop-color="#ffffff"
				stop-opacity="0.20" />
			<stop
				offset="100%"
				stop-color="#ffffff"
				stop-opacity="0.04" />
		</linearGradient>
		<linearGradient
			id="edge"
			x1="0"
			y1="0"
			x2="1"
			y2="1">
			<stop
				offset="0%"
				stop-color="#ffffff"
				stop-opacity="0.55" />
			<stop
				offset="50%"
				stop-color="#ffffff"
				stop-opacity="0.06" />
			<stop
				offset="100%"
				stop-color="#ffffff"
				stop-opacity="0.3" />
		</linearGradient>
		<linearGradient
			id="txt"
			x1="0"
			y1="0"
			x2="1"
			y2="0">
			<stop
				offset="0%"
				stop-color="#00f5ff" />
			<stop
				offset="50%"
				stop-color="#e8fbff" />
			<stop
				offset="100%"
				stop-color="#ff5ce1" />
		</linearGradient>
		<linearGradient
			id="sheen"
			x1="0"
			y1="0"
			x2="1"
			y2="0">
			<stop
				offset="0%"
				stop-color="#fff"
				stop-opacity="0" />
			<stop
				offset="50%"
				stop-color="#fff"
				stop-opacity="0.18" />
			<stop
				offset="100%"
				stop-color="#fff"
				stop-opacity="0" />
		</linearGradient>
		<radialGradient
			id="b1"
			cx="50%"
			cy="50%"
			r="50%">
			<stop
				offset="0%"
				stop-color="#6c63ff"
				stop-opacity="0.8" />
			<stop
				offset="100%"
				stop-color="#6c63ff"
				stop-opacity="0" />
		</radialGradient>
		<radialGradient
			id="b2"
			cx="50%"
			cy="50%"
			r="50%">
			<stop
				offset="0%"
				stop-color="#00d4ff"
				stop-opacity="0.65" />
			<stop
				offset="100%"
				stop-color="#00d4ff"
				stop-opacity="0" />
		</radialGradient>
		<radialGradient
			id="b3"
			cx="50%"
			cy="50%"
			r="50%">
			<stop
				offset="0%"
				stop-color="#ff5ce1"
				stop-opacity="0.6" />
			<stop
				offset="100%"
				stop-color="#ff5ce1"
				stop-opacity="0" />
		</radialGradient>
		<clipPath id="frame">
			<rect
				width="1000"
				height="300"
				rx="24" />
		</clipPath>
		<clipPath id="panel">
			<rect
				x="90"
				y="45"
				width="820"
				height="210"
				rx="30" />
		</clipPath>
		<clipPath id="typeName">
			<rect
				class="reveal rName"
				x="275"
				y="90"
				width="450"
				height="80" />
		</clipPath>
		<clipPath id="typeRole">
			<rect
				class="reveal rRole"
				x="260"
				y="170"
				width="480"
				height="40" />
		</clipPath>
	</defs>

	<style>
		/* One 10s loop: type name 0.5-2.5s, type role 3.0-5.4s, hold + blink to 8.4s, fade out, repeat */
		.reveal {
			transform-box: fill-box;
			transform-origin: left center;
		}
		.rName {
			animation: revealName 10s infinite;
		}
		.rRole {
			animation: revealRole 10s infinite;
		}
		.fade {
			animation: fadeText 10s infinite;
		}
		.c1 {
			animation: c1vis 10s infinite;
		}
		.c1 rect {
			animation: moveName 10s infinite;
		}
		.c2 {
			opacity: 0;
			animation: c2vis 10s infinite;
		}
		.c2 g {
			animation: blinkHold 10s step-end infinite;
		}
		.c2 rect {
			animation: moveRole 10s infinite;
		}

		.orb1 {
			animation: drift1 14s ease-in-out infinite alternate;
		}
		.orb2 {
			animation: drift2 17s ease-in-out infinite alternate;
		}
		.orb3 {
			animation: drift3 12s ease-in-out infinite alternate;
		}
		.shine {
			animation: sweep 6s 6s ease-in-out infinite;
		}
		.tw1 {
			animation: twinkle 3.2s ease-in-out infinite;
		}
		.tw2 {
			animation: twinkle 4.1s 0.9s ease-in-out infinite;
		}
		.tw3 {
			animation: twinkle 3.7s 1.7s ease-in-out infinite;
		}

		@keyframes revealName {
			0%,
			5% {
				transform: scaleX(0);
				animation-timing-function: steps(15, end);
			}
			25%,
			100% {
				transform: scaleX(1);
			}
		}
		@keyframes revealRole {
			0%,
			30% {
				transform: scaleX(0);
				animation-timing-function: steps(27, end);
			}
			54%,
			100% {
				transform: scaleX(1);
			}
		}
		@keyframes moveName {
			0%,
			5% {
				transform: translateX(0);
				animation-timing-function: steps(15, end);
			}
			25%,
			100% {
				transform: translateX(450px);
			}
		}
		@keyframes moveRole {
			0%,
			30% {
				transform: translateX(0);
				animation-timing-function: steps(27, end);
			}
			54%,
			100% {
				transform: translateX(480px);
			}
		}
		@keyframes fadeText {
			0%,
			84% {
				opacity: 1;
			}
			90%,
			100% {
				opacity: 0;
			}
		}
		@keyframes c1vis {
			0%,
			26% {
				opacity: 1;
			}
			26.01%,
			100% {
				opacity: 0;
			}
		}
		@keyframes c2vis {
			0%,
			28.9% {
				opacity: 0;
			}
			29%,
			88% {
				opacity: 1;
			}
			90%,
			100% {
				opacity: 0;
			}
		}
		@keyframes blinkHold {
			0%,
			54% {
				opacity: 1;
			}
			59% {
				opacity: 0;
			}
			64% {
				opacity: 1;
			}
			69% {
				opacity: 0;
			}
			74% {
				opacity: 1;
			}
			79% {
				opacity: 0;
			}
			84%,
			100% {
				opacity: 1;
			}
		}
		@keyframes drift1 {
			to {
				transform: translate(170px, 40px);
			}
		}
		@keyframes drift2 {
			to {
				transform: translate(-200px, -35px);
			}
		}
		@keyframes drift3 {
			to {
				transform: translate(110px, 50px);
			}
		}
		@keyframes sweep {
			0%,
			35% {
				transform: translateX(-300px);
			}
			85%,
			100% {
				transform: translateX(1100px);
			}
		}
		@keyframes twinkle {
			0%,
			100% {
				opacity: 0.12;
			}
			50% {
				opacity: 0.9;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.rName,
			.rRole,
			.fade,
			.c1 rect,
			.c2 rect,
			.c2 g,
			.orb1,
			.orb2,
			.orb3,
			.shine,
			.tw1,
			.tw2,
			.tw3 {
				animation: none;
			}
			.c1 {
				display: none;
				animation: none;
			}
			.c2 {
				display: none;
				animation: none;
			}
			.shine {
				opacity: 0;
			}
		}
	</style>

	<g clip-path="url(#frame)">
		<rect
			width="1000"
			height="300"
			fill="url(#bg)" />
		<circle
			class="orb1"
			cx="200"
			cy="100"
			r="230"
			fill="url(#b1)" />
		<circle
			class="orb2"
			cx="810"
			cy="215"
			r="250"
			fill="url(#b2)" />
		<circle
			class="orb3"
			cx="560"
			cy="50"
			r="190"
			fill="url(#b3)" />

		<g>
			<rect
				x="90"
				y="45"
				width="820"
				height="210"
				rx="30"
				fill="url(#glass)"
				stroke="url(#edge)"
				stroke-width="1.5" />
			<g clip-path="url(#panel)">
				<rect
					class="shine"
					x="0"
					y="45"
					width="200"
					height="210"
					fill="url(#sheen)"
					transform="skewX(-18)" />
			</g>

			<circle
				class="tw1"
				cx="130"
				cy="85"
				r="2.5"
				fill="#ffffff" />
			<circle
				class="tw2"
				cx="872"
				cy="76"
				r="2"
				fill="#00f5ff" />
			<circle
				class="tw3"
				cx="846"
				cy="226"
				r="2.5"
				fill="#ff5ce1" />
			<circle
				class="tw2"
				cx="160"
				cy="224"
				r="2"
				fill="#c9b8ff" />

			<g class="fade">
				<g clip-path="url(#typeName)">
					<text
						x="275"
						y="144"
						textLength="450"
						lengthAdjust="spacing"
						font-family="'Segoe UI', Arial, sans-serif"
						font-size="54"
						font-weight="700"
						fill="url(#txt)">
						Aung Kaung Myat
					</text>
				</g>
				<g clip-path="url(#typeRole)">
					<text
						x="260"
						y="194"
						textLength="480"
						lengthAdjust="spacing"
						font-family="'Segoe UI', Arial, sans-serif"
						font-size="18"
						fill="#eaeaff">
						JUNIOR FULL-STACK DEVELOPER
					</text>
				</g>
			</g>

			<g class="c1">
				<rect
					x="275"
					y="102"
					width="4"
					height="58"
					rx="2"
					fill="#7de8ff" />
			</g>
			<g class="c2">
				<g>
					<rect
						x="260"
						y="174"
						width="3"
						height="26"
						rx="1.5"
						fill="#7de8ff" />
				</g>
			</g>
		</g>
	</g>
</svg>
